<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Revolt Racing</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas {
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      color: #fff;
      z-index: 100;
    }
    #start-screen h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #ff6b6b;
    }
    #loading-bar {
      width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin: 20px 0;
      overflow: hidden;
    }
    #loading-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
      transition: width 0.3s;
    }
    #loading-text {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    #start-btn {
      padding: 15px 40px;
      font-size: 24px;
      background: #ff6b6b;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #start-btn:hover {
      transform: scale(1.05);
    }
    #result-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      color: #fff;
      z-index: 101;
    }
    #result-screen h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700;
    }
    #result-screen .trophy {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    #result-screen .stat {
      font-size: 24px;
      margin: 10px 0;
      color: #fff;
    }
    #result-screen .stat-label {
      color: rgba(255,255,255,0.7);
      margin-right: 10px;
    }
    #result-screen .stat-value {
      color: #00ff00;
      font-weight: bold;
      font-size: 28px;
    }
    #leaderboard {
      margin: 20px 0;
      width: 90%;
      max-width: 500px;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    #leaderboard th {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #000;
      padding: 12px 15px;
      font-size: 16px;
      font-weight: bold;
      text-align: left;
    }
    #leaderboard td {
      padding: 10px 15px;
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #leaderboard tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }
    #leaderboard tr.player-row {
      background: rgba(255, 107, 107, 0.3);
      font-weight: bold;
    }
    #leaderboard tr:first-child td:first-child {
      color: #ffd700;
    }
    #leaderboard tr:nth-child(2) td:first-child {
      color: #c0c0c0;
    }
    #leaderboard tr:nth-child(3) td:first-child {
      color: #cd7f32;
    }
    .position-badge {
      display: inline-block;
      width: 30px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      font-weight: bold;
      margin-right: 8px;
    }
    #restart-btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 24px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }
    #menu-btn {
      margin-top: 15px;
      padding: 12px 35px;
      font-size: 18px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    #menu-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #mobile-steer-zone {
      position: absolute;
      bottom: 30px;
      left: 15px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 70%, transparent 100%);
      border: 2px solid rgba(255,255,255,0.12);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
      touch-action: none;
    }
    #mobile-steer-zone .steer-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: all 0.1s ease;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    #mobile-steer-zone .steer-btn:active, #mobile-steer-zone .steer-btn.active {
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.12) 100%);
      border-color: rgba(255,255,255,0.4);
      transform: scale(0.92);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    #mobile-action-zone {
      position: absolute;
      bottom: 30px;
      right: 15px;
      width: 110px;
      height: 160px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      touch-action: none;
    }
    #mobile-action-zone .action-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: all 0.1s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #btn-gas {
      background: radial-gradient(circle at 40% 35%, #4ade80 0%, #16a34a 100%);
      border: 2px solid rgba(74, 222, 128, 0.5);
      font-size: 24px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #btn-gas:active, #btn-gas.active {
      transform: scale(0.90);
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
      border-color: #4ade80;
    }
    #btn-brake {
      width: 54px;
      height: 54px;
      background: radial-gradient(circle at 40% 35%, #f87171 0%, #dc2626 100%);
      border: 2px solid rgba(248, 113, 113, 0.5);
      font-size: 18px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #btn-brake:active, #btn-brake.active {
      transform: scale(0.92);
      box-shadow: 0 0 25px rgba(248, 113, 113, 0.5);
      border-color: #f87171;
    }
    .mobile-label {
      position: absolute;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.25);
      pointer-events: none;
    }
    #mobile-controls .label-gas {
      bottom: 95px;
      right: 65px;
    }
    #mobile-controls .label-brake {
      bottom: 8px;
      right: 60px;
    }
    #mobile-controls .label-left {
      bottom: -5px;
      left: 50px;
    }
    #mobile-controls .label-right {
      bottom: -5px;
      right: 50px;
    }
    
    #flip-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      font-size: 18px;
      background: rgba(255, 107, 107, 0.8);
      border: 2px solid #fff;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      display: none;
      touch-action: manipulation;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    #flip-btn:hover {
      background: rgba(255, 107, 107, 1);
    }
    #item-indicator {
      position: absolute;
      top: 180px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 10px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      min-height: 80px;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #item-indicator:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }
    #item-indicator.ready {
      border-color: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    }
    
    #item-icon {
      font-size: 32px;
      margin-bottom: 5px;
    }
    #item-name {
      font-size: 12px;
      color: #fff;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-layer">
      <div id="hud">
        <div>Lap: <span id="lap">1</span>/3</div>
        <div>Time: <span id="time">0.00</span>s</div>
        <div>Best: <span id="best">--</span></div>
        <div id="checkpoint-distance" style="margin-top: 8px; color: #ff6600; font-weight: bold;">🎯 --м</div>
      </div>
      <div id="item-indicator">
        <div id="item-icon"></div>
        <div id="item-name"></div>
      </div>
      
      
      <div id="mobile-controls">
        <div id="mobile-steer-zone">
          <button class="steer-btn" id="btn-left">◀</button>
          <button class="steer-btn" id="btn-right">▶</button>
          <span class="mobile-label label-left">LEFT</span>
          <span class="mobile-label label-right">RIGHT</span>
        </div>
        <div id="mobile-action-zone">
          <button class="action-btn" id="btn-gas">⛽</button>
          <button class="action-btn" id="btn-brake">✕</button>
          <span class="mobile-label label-gas">GAS</span>
          <span class="mobile-label label-brake">BRAKE</span>
        </div>
      </div>
      <button id="flip-btn">🔄 Перевернуть</button>
    </div>
    <div id="start-screen">
      <h1>🏎️ REVOLT RACING</h1>
      <div id="loading-bar">
        <div id="loading-progress"></div>
      </div>
      <div id="loading-text">Загрузка модели...</div>
      <button id="start-btn" style="display: none;">🏁 СТАРТ</button>
    </div>
    <div id="result-screen">
      <div class="trophy">🏆</div>
      <h1>ГОНКА ЗАВЕРШЕНА!</h1>
      <div class="stat">
        <span class="stat-label">Время:</span>
        <span class="stat-value" id="final-time">0.00s</span>
      </div>
      <div class="stat">
        <span class="stat-label">Круги:</span>
        <span class="stat-value" id="final-laps">0</span>
      </div>
      <button id="restart-btn">🔄 Ещё раз</button>
      <button id="menu-btn">📋 Меню</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
