name: Koda
version: 0.0.1
schema: v1
models:
- name: Koda Models
  provider: koda-chat-models
  model: AUTODETECT
roles:
- agent
- chat
- edit
context:
- provider: code
- provider: docs
- provider: diff
- provider: terminal
- provider: problems
- provider: folder
- provider: codebase
mcpServers:
- name: Playwright
  command: npx
  args:
    - -y
    - "@playwright/mcp@latest"
  env: {}
- name: Filesystem
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-filesystem"
    - "."
  env: {}
- name: Git
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-git"
  env: {}
- name: GitHub
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-github"
  env: {}
- name: Fetch
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-fetch"
  env: {}
- name: PostgreSQL
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-postgres"
    - "postgresql://localhost:5432/game_db"
  env: {}
- name: Memory
  command: npx
  args:
    - -y
    - "@modelcontextprotocol/server-memory"
  env: {}
- name: Three.js
  command: npx
   args:
    - -y
    - "@threejs/mcp"
  env: {}
